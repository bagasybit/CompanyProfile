<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Carousel</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicator -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0"
        class="active"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
    </div>

    <!-- Gambar -->
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://i.pinimg.com/736x/83/5e/c9/835ec94a5ec8b49d3983ce605b1c0836.jpg" class="d-block w-35 mx-auto" alt="Gambar 1">
      </div>

      <div class="carousel-item">
            <img src="https://i.pinimg.com/736x/0e/79/e9/0e79e9c68d46e2b5f2c4916c480e0952.jpg" class="d-block w-35 mx-auto" alt="Gambar 2">
        
      </div>

      <div class="carousel-item">

            <img src="https://i.pinimg.com/736x/17/74/9a/17749a554098996958e5d3f1fcf7b2a5.jpg" class="d-block w-35 mx-auto" alt="Gambar 3">
     
      </div>

    </div>

    <!-- Tombol kiri -->
    <button class="carousel-control-prev" type="button"
      data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>
    </button>

    <!-- Tombol kanan -->
    <button class="carousel-control-next" type="button"
      data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>
    </button>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
