<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container rounded-4 mt-3 bg-secondary">
        <h2 CLASS="text-center text-primary p-4"><span style="color: #bf00bf">F</span><span style="color: #d402a7">o</span><span style="color: #e50a8e">r</span><span style="color: #f21674">m</span><span style="color: #fb275b">u</span><span style="color: #fe3c43">l</span><span style="color: #fd532e">i</span><span style="color: #f66c1c">r</span> <span style="color: #da9f04">P</span><span style="color: #c6b700">e</span><span style="color: #afcd01">n</span><span style="color: #97e007">d</span><span style="color: #7dee12">a</span><span style="color: #63f921">f</span><span style="color: #4bfe34">t</span><span style="color: #34fe4b">a</span><span style="color: #21f963">r</span><span style="color: #12ee7d">a</span><span style="color: #07e097">n</span> <span style="color: #00b7c6">S</span><span style="color: #049fda">i</span><span style="color: #0d85ea">s</span><span style="color: #1c6cf6">w</span><span style="color: #2e53fd">a</span> <span style="color: #5b27fb">B</span><span style="color: #7416f2">a</span><span style="color: #8e0ae5">r</span><span style="color: #a702d4">u</span></h2>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="masukkan NIPD" class="form-control">
            <label>NIPD</label> 
        </div>
        <div class="mb-3 form-floating">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label>
        </div>
        <div class="mb-3 form-floating">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>
        <div class="mb-3 form-floating">
            <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
            <label>Alamat Lengkap</label>
        </div>
        <div class="mb-3 form-floating">
            <select class="form-select">
                <option disabled selected hidden>Pilih Jurusan</option>
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Komputer Dan Jaringan</option>
                <option>Desain Komunikasi Visual</option>
                <option>Akuntasi</option>
                <option>Bisnis Digital</option>
            </select>
            <label>Pilih Jurusan</label>
        </div>
        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Volly</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Pramuka</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Natbinari</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul PMR</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Paskibra</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Futsal</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Badminton</label>
        </div>
        <div>
            <div class="row">
                <div class="col-1">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Laki-Laki</label>
                </div>
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Perempuan</label>
                </div>
            </div>
        </div>
        <button class="btn btn-warning" data-bs-toggle="tooltip" title="Simpan">
        Simpan Data
    </button>
        <button class="btn btn-danger" data-bs-toggle="tooltip" title="Hapus">HAPUS DATA</button>
    </div>




    <script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        new bootstrap.Tooltip(document.querySelector('[data-bs-toggle="tooltip"]'));
    </script>
</body>
</html>
